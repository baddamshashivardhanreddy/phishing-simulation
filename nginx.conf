# ==============================================================================
# PhishGuard - Nginx Dual-Subdomain Configuration (Production)
#
# Architecture:
# 1. Admin Portal (admin.yourcompany.com) -> Accessible ONLY by IT Security Admins
# 2. Phishing Decoy (rewards.yourcompany.com) -> Target links sent in simulation emails
#
# Place this file in: /etc/nginx/sites-available/phishguard.conf
# Enable with: ln -s /etc/nginx/sites-available/phishguard.conf /etc/nginx/sites-enabled/
# Test with: nginx -t && systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ADMIN CONSOLE SUBDOMAIN (admin.yourcompany.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.yourcompany.com; # <-- Replace with your Admin Subdomain or IP

    # Path to your project root (CodeIgniter front controller index.php)
    root /var/www/phishing-simulation;
    index index.php index.html;

    # Maximum file upload size (for CSV target imports & inline evidence images)
    client_max_body_size 25M;

    # Optional: Restrict Admin Portal to internal corporate network / VPN
    # allow 10.0.0.0/8;
    # allow 192.168.1.0/24;
    # allow 203.0.113.50; # Your office static public IP
    # deny all;

    # Standard routing to CodeIgniter front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        include fastcgi_params;
        # Change to your PHP-FPM version (e.g. php8.1-fpm or php8.2-fpm or 127.0.0.1:9000)
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Inform the application of the Admin Server Domain
        fastcgi_param ADMIN_SERVER_URL "http://admin.yourcompany.com";
        # Configure the target Phishing Domain sent in emails
        fastcgi_param PHISH_SERVER_URL "http://rewards.yourcompany.com";

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SECURITY: Block access to environment, git, and internal framework files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /writable/ {
        deny all;
        return 404;
    }

    location ^~ /app/ {
        deny all;
        return 404;
    }

    location ^~ /system/ {
        deny all;
        return 404;
    }

    location ^~ /tests/ {
        deny all;
        return 404;
    }
}

# ------------------------------------------------------------------------------
# 2. PHISHING / USER SIMULATION SUBDOMAIN (rewards.yourcompany.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name rewards.yourcompany.com; # <-- Replace with your Phishing/Decoy Subdomain

    root /var/www/phishing-simulation;
    index index.php index.html;

    client_max_body_size 10M;

    # STRICT STEALTH: Return 404 on root / so targets see nothing if inspecting the base domain
    location = / {
        return 404;
    }

    # STRICT CLOAKING: Hard block any attempt to access admin or login interfaces
    location ~* ^/(admin|login|logout|quiz)(\/.*)?$ {
        return 404;
    }

    # Allow simulation routes (/download, /training, /image, /report)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing for simulation endpoints
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Flag this server as the public Phishing Domain (triggers strict cloaking in CodeIgniter)
        fastcgi_param IS_PHISH_SERVER "1";
        fastcgi_param PHISH_SERVER_URL "http://rewards.yourcompany.com";
        fastcgi_param ADMIN_SERVER_URL "http://admin.yourcompany.com";

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120;
    }

    # Serve static assets required for simulation landing page (CSS, images, icons)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SECURITY: Block access to environment, git, and internal framework files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /writable/ {
        deny all;
        return 404;
    }

    location ^~ /app/ {
        deny all;
        return 404;
    }

    location ^~ /system/ {
        deny all;
        return 404;
    }
}

