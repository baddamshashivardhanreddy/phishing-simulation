version: '3.8'

services:
  phishcall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishcall
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # AWS RDS MySQL Configuration (replace with your AWS RDS endpoint & credentials)
      - DB_HOST=phishcall-db.cxxxxxxx.us-east-1.rds.amazonaws.com
      - DB_DATABASE=phishing_simulation
      - DB_USER=admin
      - DB_PASS=YourStrongRdsPassword
      - DB_PORT=3306

      # Domain Cloaking & Application URLs
      - APP_BASE_URL=http://admin.yourcompany.com/
      - ADMIN_SERVER_URL=http://admin.yourcompany.com
      - PHISH_SERVER_URL=http://rewards.yourcompany.com
      - CI_ENVIRONMENT=production
    volumes:
      # Persistent volume for logs, session data, cache, and uploaded attachments
      - phishcall_data:/var/www/html/writable
      # Optional: Mount your host .env file directly if managing credentials in .env instead
      # - ./.env:/var/www/html/.env
    networks:
      - phishcall_network

volumes:
  phishcall_data:
    driver: local

networks:
  phishcall_network:
    driver: bridge

