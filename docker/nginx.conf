user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # =========================================================================
    # UNIVERSAL SERVER (Dynamic Dual-Domain Routing via Application .env)
    #
    # Nginx accepts all incoming traffic on port 80/443 regardless of hostname.
    # The application's DomainCloakFilter automatically handles domain separation:
    # - ADMIN_SERVER_URL: Provides access to Admin Login & Dashboard
    # - PHISH_SERVER_URL: Serves simulation links; strictly returns 404 on /login and /admin
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # Standard routing to CodeIgniter front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM processing
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 300;
        }

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Security: Block hidden files and internal framework folders
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ^~ /writable/ {
            deny all;
            return 404;
        }

        location ^~ /app/ {
            deny all;
            return 404;
        }

        location ^~ /system/ {
            deny all;
            return 404;
        }

        location ^~ /tests/ {
            deny all;
            return 404;
        }
    }
}
