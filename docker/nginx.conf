user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # =========================================================================
    # 1. ADMIN SUBDOMAIN (e.g. admin.yourcompany.com)
    # =========================================================================
    server {
        listen 80;
        server_name ~^admin\..+$; # Matches any subdomain starting with 'admin.'

        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 300;
        }

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Security: Deny internal directories & hidden files
        location ~ /\.(?!well-known).* {
            deny all;
        }
        location ^~ /writable/ {
            deny all;
            return 404;
        }
        location ^~ /app/ {
            deny all;
            return 404;
        }
        location ^~ /system/ {
            deny all;
            return 404;
        }
    }

    # =========================================================================
    # 2. PHISHING / USER SIMULATION (Default Catch-All or rewards.yourcompany.com)
    # =========================================================================
    server {
        listen 80 default_server;
        server_name _; # Default server handles all non-admin hostnames/subdomains

        root /var/www/html;
        index index.php index.html;

        # Stealth: Root / returns authentic 404 Not Found
        location = / {
            return 404;
        }

        # Cloak: Block admin and login paths with 404
        location ~* ^/(admin|login|logout|quiz)(\/.*)?$ {
            return 404;
        }

        # Phishing routes (/download, /training, /image, /report)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            fastcgi_param IS_PHISH_SERVER "1";

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 120;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
        location ^~ /writable/ {
            deny all;
            return 404;
        }
        location ^~ /app/ {
            deny all;
            return 404;
        }
        location ^~ /system/ {
            deny all;
            return 404;
        }
    }
}

